<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    <meta name="description" content="Cabine d'essayage virtuelle Dukani — visualisez le vêtement en 3D">
    <title>Essayage 3D — Dukani</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .essayage-page {
            max-width: 560px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .essayage-entete {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--verre-fort);
            -webkit-backdrop-filter: var(--flou);
            backdrop-filter: var(--flou);
            border-bottom: 1px solid var(--verre-bord);
        }

        .essayage-entete h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .essayage-retour {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid var(--verre-bord);
            border-radius: 50%;
            background: var(--verre);
            color: var(--encre);
            cursor: pointer;
        }

        .essayage-viewer {
            position: relative;
            height: min(52vh, 420px);
            margin: 12px 16px 0;
            width: calc(100% - 32px);
            border-radius: 24px;
            overflow: hidden;
            background: var(--verre);
            border: 1px solid var(--verre-bord);
            box-shadow: var(--reflet), var(--ombre);
        }

        #canvas-3d {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .essayage-hint {
            position: absolute;
            left: 12px;
            bottom: 12px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--encre-douce);
            background: var(--g85);
            border: 1px solid var(--verre-bord);
            border-radius: 999px;
            pointer-events: none;
        }

        .essayage-produit {
            margin: 16px 16px 0;
            padding: 16px;
            background: var(--verre);
            border: 1px solid var(--verre-bord);
            border-radius: 20px;
            box-shadow: var(--reflet);
        }

        .essayage-produit h2 {
            margin: 0 0 4px;
            font-size: 18px;
        }

        .essayage-produit .prix {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--violet-texte);
        }

        .essayage-produit .boutique {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--encre-douce);
        }

        .essayage-section {
            margin: 14px 16px 0;
        }

        .essayage-section label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--encre-douce);
        }

        .choix-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .choix-pills button {
            min-width: 48px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: var(--encre);
            background: var(--verre-fort);
            border: 1px solid var(--verre-bord);
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.15s ease;
        }

        .choix-pills button.actif {
            color: #fff;
            background: linear-gradient(135deg, var(--violet-clair), var(--violet));
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.3);
        }

        .choix-pills button:active {
            transform: scale(0.96);
        }

        .choix-couleurs button {
            width: 40px;
            height: 40px;
            min-width: 40px;
            padding: 0;
            border-radius: 50%;
            border: 2px solid var(--verre-bord);
        }

        .choix-couleurs button.actif {
            outline: 3px solid var(--violet);
            outline-offset: 2px;
            background: none;
            box-shadow: none;
        }

        .essayage-actions {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
            background: var(--verre-fort);
            -webkit-backdrop-filter: var(--flou);
            backdrop-filter: var(--flou);
            border-top: 1px solid var(--verre-bord);
        }

        .essayage-actions .creer {
            margin: 0;
        }

        .etapes-mini {
            display: flex;
            gap: 6px;
            margin: 12px 16px 0;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .etapes-mini span {
            flex-shrink: 0;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--encre-douce);
            background: var(--g55);
            border: 1px solid var(--verre-bord);
            border-radius: 999px;
        }

        .etapes-mini span.actif {
            color: var(--violet-texte);
            background: rgba(124, 58, 237, 0.12);
            border-color: rgba(124, 58, 237, 0.35);
        }

        .mensurations-grille {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mensurations-grille label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--encre-douce);
        }

        .mensurations-grille input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--encre);
            background: var(--verre-fort);
            border: 1px solid var(--verre-bord);
            border-radius: 14px;
            outline: none;
        }

        .mensurations-grille input:focus {
            border-color: rgba(124, 58, 237, 0.55);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .photo-zone {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .photo-apercu {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            object-fit: cover;
            background: var(--g55);
            border: 1px solid var(--verre-bord);
            display: none;
        }

        .photo-apercu.visible {
            display: block;
        }

        .photo-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .photo-actions button,
        .photo-actions label.fichier {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: var(--encre);
            background: var(--verre-fort);
            border: 1px solid var(--verre-bord);
            border-radius: 999px;
            cursor: pointer;
        }

        .photo-actions input[type="file"] {
            display: none;
        }

        .aide-mensurations {
            margin: 8px 0 0;
            font-size: 12px;
            color: var(--encre-douce);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="essayage-page">
        <header class="essayage-entete">
            <button type="button" class="essayage-retour" id="btn-retour" aria-label="Retour">←</button>
            <h1>Cabine d'essayage</h1>
        </header>

        <div class="etapes-mini" aria-label="Étapes">
            <span>1. Produit</span>
            <span class="actif">2. Photo & mensurations</span>
            <span>3. Essayage 3D</span>
            <span>4. Panier</span>
        </div>

        <div class="essayage-viewer">
            <canvas id="canvas-3d"></canvas>
            <div class="essayage-hint">Chargement du modèle…</div>
        </div>

        <div class="essayage-produit">
            <h2 id="nom-produit">T-shirt Premium</h2>
            <p class="prix" id="prix-produit">25 000 FC</p>
            <p class="boutique" id="nom-boutique">Boutique démo</p>
        </div>

        <div class="essayage-section">
            <label>Votre photo (optionnel)</label>
            <div class="photo-zone">
                <img id="photo-apercu" class="photo-apercu" alt="Aperçu">
                <div class="photo-actions">
                    <label class="fichier">
                        📷 Prendre / choisir une photo
                        <input type="file" id="input-photo" accept="image/*" capture="user">
                    </label>
                    <button type="button" id="btn-effacer-photo" hidden>Retirer la photo</button>
                </div>
            </div>
            <p class="aide-mensurations">La photo sert de référence visuelle. L’analyse IA arrivera plus tard.</p>
        </div>

        <div class="essayage-section">
            <label>Vos mensurations (cm)</label>
            <div class="mensurations-grille">
                <div>
                    <label for="m-taille">Taille (hauteur)</label>
                    <input type="number" id="m-taille" inputmode="decimal" min="120" max="220" step="1" placeholder="170">
                </div>
                <div>
                    <label for="m-poitrine">Tour de poitrine</label>
                    <input type="number" id="m-poitrine" inputmode="decimal" min="60" max="160" step="1" placeholder="92">
                </div>
                <div>
                    <label for="m-taille-tour">Tour de taille</label>
                    <input type="number" id="m-taille-tour" inputmode="decimal" min="50" max="150" step="1" placeholder="78">
                </div>
                <div>
                    <label for="m-hanches">Tour de hanches</label>
                    <input type="number" id="m-hanches" inputmode="decimal" min="60" max="160" step="1" placeholder="96">
                </div>
            </div>
            <p class="aide-mensurations">Ces valeurs ajustent le mannequin 3D. Elles sont enregistrées sur cet appareil.</p>
        </div>

        <div class="essayage-section">
            <label>Taille</label>
            <div class="choix-pills" id="choix-tailles" role="group" aria-label="Taille">
                <button type="button" data-taille="XS">XS</button>
                <button type="button" data-taille="S">S</button>
                <button type="button" class="actif" data-taille="M">M</button>
                <button type="button" data-taille="L">L</button>
                <button type="button" data-taille="XL">XL</button>
            </div>
        </div>

        <div class="essayage-section">
            <label>Couleur</label>
            <div class="choix-pills choix-couleurs" id="choix-couleurs" role="group" aria-label="Couleur">
                <button type="button" class="actif" data-couleur="#7c3aed" style="background:#7c3aed" aria-label="Violet"></button>
                <button type="button" data-couleur="#1e293b" style="background:#1e293b" aria-label="Noir"></button>
                <button type="button" data-couleur="#f8fafc" style="background:#f8fafc;border-color:#94a3b8" aria-label="Blanc"></button>
                <button type="button" data-couleur="#dc2626" style="background:#dc2626" aria-label="Rouge"></button>
                <button type="button" data-couleur="#2563eb" style="background:#2563eb" aria-label="Bleu"></button>
            </div>
        </div>
    </div>

    <div class="essayage-actions">
        <button type="button" class="creer" id="btn-panier">Ajouter au panier</button>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="essayage.js"></script>
</body>
</html>
