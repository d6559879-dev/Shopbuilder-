    <header class="header">
        <div class="logo">🛍️ <span id="v-logo">Boutique</span></div>
        <div class="header-droite">
            <button class="theme-btn" type="button" onclick="ouvrirParametres()" aria-label="Paramètres" title="Paramètres"><svg class="ic" aria-hidden="true"><use href="#ic-settings"></use></svg></button>
            <a href="index.html" class="lien-retour">← Boutiques</a>
        </div>
    </header>

    <main class="accueil">

        <section class="hero">
            <img id="v-photo" class="photo-hero" alt="" hidden>
            <span class="badge">🏪 Bienvenue</span>
            <h1 id="v-nom">Chargement…</h1>
            <p id="v-description"></p>
            <div class="contact-boutique">
                <a id="v-tel" class="bouton-principal" hidden>📞 Appeler la boutique</a>
                <a id="v-whatsapp" class="bouton-principal bouton-whatsapp" hidden>💬 Écrire sur WhatsApp</a>
                <button id="v-discuter" class="bouton-principal bouton-discuter" type="button">💬 Discuter avec la boutique</button>
                <button id="v-statuts" class="bouton-principal bouton-statuts" type="button" hidden>📣 Nouveaux arrivages</button>
            </div>
        </section>

        <section class="fonctionnalites">
            <h2>Nos produits</h2>
            <div id="v-produits" class="grille-produits"></div>
        </section>

        <p class="pied-vitrine">Propulsé par Dukani</p>

    </main>

    <div id="commande" class="fenetre">
        <div class="creation-box">
            <button class="fermer" onclick="fermerCommande()">✕</button>
            <h2>🛒 Commander</h2>
            <p class="sous-titre" id="c-produit"></p>

            <label>Quantité</label>
            <input id="c-quantite" type="number" min="1" value="1">

            <label>Votre nom</label>
            <input id="c-client" type="text" placeholder="Ex : Marie" maxlength="80">

            <label>Votre téléphone</label>
            <input id="c-telephone" type="tel" placeholder="Ex : 08XXXXXXXX" maxlength="30">

            <div id="c-paiement-bloc" hidden>
                <label>Mode de paiement</label>
                <select id="c-paiement"></select>
            </div>

            <button class="creer" id="c-bouton" onclick="envoyerCommande()">Envoyer la commande</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="statuts.js"></script>
    <script src="vitrine.js"></script>
</body>
</html>
